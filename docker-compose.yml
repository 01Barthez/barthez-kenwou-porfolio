version: '3.8'

services:
  barthez-portfolio:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: production
      args:
        - VITE_SITE_URL=${VITE_SITE_URL}
        - VITE_APP_URL=${VITE_APP_URL}
        - VITE_API_BASE_URL=${VITE_API_BASE_URL}
        - VITE_ENABLE_PWA=${VITE_ENABLE_PWA}
        - VITE_APP_TITLE=${VITE_APP_TITLE}
    image: barthez/portfolio:latest
    container_name: barthez-portfolio
    restart: unless-stopped
    env_file:
      - .env
    # Volumes for persistent data or custom configs if needed
    volumes:
      - /srv/data/barthez-portfolio:/usr/share/nginx/html/data
      - ./infra/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - web-proxy
    expose:
      - "80"
    labels:
      - "project=barthez-portfolio"
      - "client=barthez"
      - "env=production"
      # Example labels for Traefik (adjust if using a different proxy)
      - "traefik.enable=true"
      - "traefik.http.routers.barthez-portfolio.rule=Host(`barthez-kenwou.dev`)"
      - "traefik.http.routers.barthez-portfolio.entrypoints=websecure"
      - "traefik.http.routers.barthez-portfolio.tls.certresolver=myresolver"

networks:
  web-proxy:
    external: true
