services:
  # production-like environment (Nginx)
  portfolio:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile
      target: production
    image: barthez-portfolio:prod
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - web-proxy
    expose:
      - "80"
    labels:
      - "project=barthez-portfolio"
      - "env=production"

  # development environment (Vite + HMR)
  dev:
    image: oven/bun:1.1.12-alpine
    working_dir: /app
    volumes:
      - ../..:/app
      - /app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      NODE_ENV: development
      PORT: "5173"
    command: sh -c "bun install && bun run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    stdin_open: true
    tty: true

networks:
  web-proxy:
    external: true
