# =============================================================================
# Barthez Kenwou - Hardened Nginx Configuration (Brotli + Gzip)
# =============================================================================

server {
  listen 80;
  server_name _;
  
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;

  # -----------------------------
  # Security Headers
  # -----------------------------
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; connect-src 'self' https://www.google-analytics.com; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; frame-src 'self' https://www.youtube-nocookie.com;" always;

  # Fallback Gzip
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

  # -----------------------------
  # Cache & Routes
  # -----------------------------

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:css|js|mjs|woff2?|woff|ttf|otf|eot|svg|png|jpg|jpeg|webp|avif|ico)$ {
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }

  # -----------------------------
  # Specialized Endpoints
  # -----------------------------

  location /healthz {
    access_log off;
    return 200 'ok';
    add_header Content-Type text/plain;
  }

  location ~* ^/(robots\.txt|sitemap\.xml) {
    access_log off;
    try_files $uri =404;
  }

  location ~ /\.|^/\. {
    deny all;
    access_log off;
    log_not_found off;
  }
}
